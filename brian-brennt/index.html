<title>Brian Brennt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single-column docket. A sticky top bar with the countdown, one scrolling column of
   panels below, a bottom tab bar on phones. Dark-first: charcoal with a warm bias, one ember accent. */
:root {
  --bg: #121214;
  --bg-2: #1a1a1e;
  --surface: #202026;
  --surface-2: #2a2a31;
  --line: #34343c;
  --fg: #f1ece4;
  --fg-2: #b5afa6;
  --fg-3: #7d7870;
  --accent: #ff7a1a;
  --accent-2: #ffb15c;
  --accent-ink: #1a1208;
  --good: #58c489;
  --warn: #e6b84a;
  --bad: #ee6a5a;
  --info: #6fa8ff;
  --tier1: #ff7a1a;
  --tier2: #e6b84a;
  --tier3: #6fa8ff;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f3ee; --bg-2: #ffffff; --surface: #ffffff; --surface-2: #efebe4; --line: #ddd7cd;
    --fg: #1d1b18; --fg-2: #5b564f; --fg-3: #8a847b;
    --accent: #e2600a; --accent-2: #c24f05; --accent-ink: #ffffff;
    --good: #1f8f55; --warn: #a97b0c; --bad: #c9432f; --info: #2b63c9;
    --tier1: #e2600a; --tier2: #a97b0c; --tier3: #2b63c9;
    --shadow: 0 10px 30px rgba(40,30,10,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f3ee; --bg-2: #ffffff; --surface: #ffffff; --surface-2: #efebe4; --line: #ddd7cd;
  --fg: #1d1b18; --fg-2: #5b564f; --fg-3: #8a847b;
  --accent: #e2600a; --accent-2: #c24f05; --accent-ink: #ffffff;
  --good: #1f8f55; --warn: #a97b0c; --bad: #c9432f; --info: #2b63c9;
  --tier1: #e2600a; --tier2: #a97b0c; --tier3: #2b63c9;
  --shadow: 0 10px 30px rgba(40,30,10,.10);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
button { font: inherit; color: inherit; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.muted { color: var(--fg-2); }
.small { font-size: 13px; }
[hidden] { display: none !important; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 760px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .flame { width: 14px; height: 18px; display: inline-block; }
.topstats { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--fg-2); }
.topstats b { color: var(--fg); font-weight: 600; }
.streak-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.streak-pill.hot { border-color: var(--accent); color: var(--accent-2); }

/* Page column */
main {
  max-width: 760px; margin: 0 auto;
  padding-block: 18px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2);
  cursor: pointer; font-weight: 600; font-size: 14px; min-height: 42px; text-decoration: none;
}
.btn:hover { border-color: var(--fg-3); }
.btn:focus-visible, .opt:focus-visible, .tab:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.big { padding: 14px 20px; font-size: 16px; min-height: 52px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.good { border-color: var(--good); color: var(--good); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn.info { border-color: var(--info); color: var(--info); }

/* Countdown hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.hero .days { font-family: var(--font-display); font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.hero .days small { font-size: 18px; font-weight: 600; color: var(--fg-2); letter-spacing: 0; margin-left: 6px; }
.hero .sub { color: var(--fg-2); margin-top: 6px; }
@media (max-width: 520px) { .hero { grid-template-columns: 1fr; } .hero .days { font-size: 52px; } }

/* Docket checklist */
.docket { display: flex; flex-direction: column; gap: 8px; }
.docket-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); }
.docket-item .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--fg-3); display: grid; place-items: center; flex: none; font-size: 13px; }
.docket-item.done .check { background: var(--good); border-color: var(--good); color: #fff; }
.docket-item .label { flex: 1; min-width: 0; }
.docket-item .count { color: var(--fg-2); }
.docket-item.done .label { color: var(--fg-2); text-decoration: line-through; }

/* Meters */
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.meter { padding: 10px 12px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); min-width: 0; }
.meter .val { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.meter .delta { font-size: 12px; font-family: var(--font-mono); }
.meter .bar { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .5s ease; }
.meter .name { font-size: 12px; color: var(--fg-2); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up { color: var(--good); } .down { color: var(--bad); }

/* Tease */
.tease { border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent); }
.tease .q { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-top: 4px; }
.blur { filter: blur(5px); user-select: none; pointer-events: none; }

/* Tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 760px; margin: 0 auto; display: flex; }
.tab { flex: 1; background: none; border: 0; padding: 10px 4px 8px; color: var(--fg-3); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
.tab svg { width: 20px; height: 20px; }
.tab.active { color: var(--accent); }
.tab .badge { position: absolute; }
.tab-wrap { position: relative; flex: 1; display: flex; }
.tab-badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 999px; font-family: var(--font-mono); }

/* Tree */
.tier { border-left: 3px solid var(--tier1); padding-left: 14px; }
.tier[data-level="2"] { border-color: var(--tier2); }
.tier[data-level="3"] { border-color: var(--tier3); }
.tier-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.node { text-align: left; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.node:hover { border-color: var(--fg-3); }
.node.locked { opacity: .75; }
.node .ring { flex: none; width: 36px; height: 36px; }
.node .t { font-weight: 600; font-size: 14px; }
.node .d { color: var(--fg-2); font-size: 12px; margin-top: 2px; }
.node .body { min-width: 0; }
.node.locked .t { color: var(--fg-2); }
.node .lock { font-size: 11px; color: var(--fg-3); margin-top: 4px; display: flex; gap: 6px; align-items: center; }
.boss-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, var(--bg-2)), var(--bg-2)); flex-wrap: wrap; }
.boss-card.beaten { border-color: var(--good); }
.boss-card.locked-out { border-color: var(--bad); }

/* Lesson */
.lesson p { margin-bottom: 12px; max-width: 65ch; }
.lesson p:last-child { margin-bottom: 0; }
pre { margin: 12px 0 0; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }
.lesson strong { color: var(--accent-2); font-weight: 600; }
.primer { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 4px; }
.primer .eyebrow { margin-bottom: 8px; }
.terms { display: grid; gap: 8px; margin-top: 12px; }
.terms dt { font-weight: 600; color: var(--accent-2); }
.terms dd { margin: 2px 0 0; color: var(--fg-2); max-width: 65ch; }

/* Session / card */
.session-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; flex: 1; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.combo { font-family: var(--font-mono); font-size: 13px; color: var(--fg-2); white-space: nowrap; }
.combo.hot { color: var(--accent-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; box-shadow: var(--shadow); min-width: 0; }
.card .kind { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 12px; }
.card .prompt { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.3; }
.card .prompt .gap { display: inline-block; min-width: 70px; border-bottom: 2px solid var(--accent); vertical-align: baseline; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.opt { text-align: left; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.opt:hover { border-color: var(--fg-3); }
.opt .key { font-family: var(--font-mono); color: var(--fg-3); flex: none; font-size: 13px; padding-top: 2px; }
.opt .txt { flex: 1; min-width: 0; }
.opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--bg-2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg-2)); }
.opt.ok { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--bg-2)); }
.opt[disabled] { cursor: default; }
.feedback { margin-top: 16px; padding: 14px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); }
.feedback .verdict { font-family: var(--font-display); font-weight: 800; font-size: 18px; display: flex; gap: 10px; align-items: center; }
.feedback .why { margin-top: 6px; color: var(--fg-2); }
.feedback .deltas { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.chip.up { border-color: var(--good); } .chip.down { border-color: var(--bad); } .chip.hot { border-color: var(--accent); color: var(--accent-2); }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.rate .btn { flex-direction: column; gap: 2px; padding: 10px 6px; }
.rate .btn small { font-weight: 400; color: var(--fg-3); font-family: var(--font-mono); font-size: 11px; }
.timer { font-family: var(--font-mono); font-size: 40px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: center; margin: 14px 0 6px; letter-spacing: .02em; }
.timer.over { color: var(--bad); }
.timer-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.timer-bar i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }
textarea, input[type="text"], input[type="date"], select {
  width: 100%; background: var(--bg-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14px; resize: vertical;
}
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
label { font-size: 13px; color: var(--fg-2); display: block; margin-bottom: 4px; }
.rubric { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.rubric label { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg); padding: 8px 10px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); cursor: pointer; margin: 0; }
.rubric input { margin-top: 3px; accent-color: var(--accent); }
.model-answer { margin-top: 14px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--bg-2); border-radius: 0 8px 8px 0; color: var(--fg-2); max-width: 65ch; }
.model-answer b { color: var(--fg); }
.situation { background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--fg-2); margin-bottom: 12px; }

/* Summary */
.summary-big { font-family: var(--font-display); font-size: 42px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.kpi { background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.kpi .v { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi .k { font-size: 12px; color: var(--fg-2); }

/* Board */
.board-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.board-big { font-family: var(--font-display); font-size: 64px; font-weight: 800; line-height: .95; letter-spacing: -.03em; color: var(--good); }
.board-big small { font-size: 26px; margin-left: 2px; }
.board-stats { display: flex; gap: 18px; }
.board-stats div { display: flex; flex-direction: column; align-items: flex-end; }
.board-stats b { font-size: 22px; font-weight: 500; }
.board-stats span { font-size: 12px; color: var(--fg-2); }
.board-stats div:nth-child(1) b { color: var(--good); }
.board-stats div:nth-child(2) b { color: var(--accent-2); }
.board-bar { position: relative; display: flex; height: 16px; border-radius: 8px; background: var(--surface-2); margin-top: 14px; }
.board-bar i { display: block; height: 100%; transition: width .6s ease; }
.board-bar i:first-child { border-radius: 8px 0 0 8px; }
.board-bar .st { background: var(--good); }
.board-bar .sn { background: var(--accent); }
.board-bar .target { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--fg); border-radius: 1px; }
.board-next { margin-top: 10px; }
.board-next b { color: var(--fg); }
.board-tiers { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.board-tier { all: unset; display: block; cursor: pointer; padding: 10px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); border-left: 3px solid var(--tc); }
.board-tier:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.board-tier-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.board-tier-head .name { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-tier-head .sep { color: var(--fg-3); }
.board-tier-head .go { color: var(--fg-3); font-weight: 400; margin-left: 2px; }
.board-tier:hover { border-color: var(--fg-3); border-left-color: var(--tc); }
.lit-n { color: var(--accent-2); }
.mosaic { display: grid; grid-template-columns: repeat(auto-fill, 9px); gap: 2px; }
.mosaic i, .lg { display: block; width: 9px; height: 9px; border-radius: 2px; }
.q3 { background: var(--good); }
.q2 { background: var(--accent); opacity: .85; }
.q1 { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.q0 { background: transparent; box-shadow: inset 0 0 0 1px var(--line); opacity: .45; }
.mosaic i.lit, .lg.lit { opacity: 1; background-image: radial-gradient(circle, #fff 0 1.6px, transparent 2.2px); animation: lit 1.4s ease-in-out 2; }
@keyframes lit { 50% { transform: scale(1.35); } }
.board-legend { gap: 14px; margin-top: 12px; }
.board-legend span { display: inline-flex; align-items: center; gap: 6px; }
.milestone { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--good); background: color-mix(in srgb, var(--good) 12%, var(--bg-2)); }
@media (max-width: 420px) { .board-big { font-size: 52px; } .board-stats { gap: 12px; } .board-stats b { font-size: 18px; } }

/* Case file */
.node-file { min-width: 0; }
.node-file[open] { grid-column: 1 / -1; }
.node-file > summary { list-style: none; }
.node-file > summary::-webkit-details-marker { display: none; }
.node-file .chev { margin-left: auto; color: var(--fg-3); transition: transform .2s ease; align-self: center; }
.node-file[open] .chev { transform: rotate(180deg); }
.node-file[open] > summary { border-color: var(--accent); border-radius: 8px 8px 0 0; }
.facts-body { border: 1px solid var(--accent); border-top: 0; border-radius: 0 0 8px 8px; padding: 12px; background: var(--bg-2); }
.lost-n { color: var(--bad); }
.locked-rest { grid-column: 1 / -1; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fact { padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--good); }
.fact .fq { font-size: 14px; }
.fact .fq strong { color: var(--good); }
.fact .fa { font-weight: 600; color: var(--good); margin-top: 4px; }
